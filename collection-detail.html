<script>
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).catch(function () { return copyFallback(text); });
  }
  return copyFallback(text);
}
function copyFallback(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.cssText = "position:fixed;left:-9999px";
  document.body.appendChild(ta);
  ta.select();
  var ok = document.execCommand("copy");
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject();
}
document.querySelectorAll("[data-copy]").forEach(function (el) {
  el.addEventListener("click", function () {
    copyText(el.getAttribute("data-copy")).then(function () {
      el.classList.add("is-copied");
      var status = el.querySelector(".copy-status");
      status.innerHTML = '<i data-lucide="check"></i> คัดลอกแล้ว';
      if (window.lucide) lucide.createIcons();
      setTimeout(function () {
        el.classList.remove("is-copied");
        status.innerHTML = '<i data-lucide="copy"></i> คัดลอก';
        if (window.lucide) lucide.createIcons();
      }, 1600);
    });
  });
});
</script>
