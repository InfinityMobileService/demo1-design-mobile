<title>เข้าสู่ระบบ — บ้านมือถือ MBH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<!--
THESIS: จุดเข้าแอปหนี้คือการยืนยันตัวตนตามสัญญา ไม่ใช่รหัสผ่าน — มาตรฐานแอปการเงินไทยที่ปฏิเสธการ์ดเงาซ้อนการ์ดและลูกเล่นที่ทำให้ฟอร์มอ่านช้าลง
OWN-WORLD: พื้นเทา #F1F2F5 การ์ดขาวเงาบาง เส้น 1px ทอง #D2A32C เป็น accent เดียวของระบบ แดง/เขียวสงวนไว้สื่อสถานะเท่านั้น Prompt ตัวเลข tabular ปุ่มสูง 52px มุม 14-18px
STORY: ลูกค้าเปิดแอป กรอกชื่อ-นามสกุล เบอร์โทร และเลขบัตรประชาชนตามสัญญา แล้วเข้าไปเห็นยอดค้าง
FIRST VIEWPORT: โลโก้บ้านมือถือกลางจอ หัวข้อเข้าสู่ระบบ ฟอร์ม 3 ช่องบนพื้นเทา ปุ่มทองเข้าสู่ระบบใต้ฟอร์ม
FORM: canon (มาตรฐานหมวด ผู้ใช้เลือกเอง) นอกลิสต์ผู้สมัครทั้ง 7 · seed 402bb3ea

<div class="app">
<script>window.PAGE = { bare: true };</script>
<script src="assets/layout.js"></script>
<div class="screen">

  <div class="text-center mt-16">
    <img class="brand-mark" src="assets/logo.jpg" alt="บ้านมือถือ MBH" width="160" height="104">
    <div class="h1 mt-16">เข้าสู่ระบบ</div>
    <div class="sub">กรอกข้อมูลตามสัญญาที่สาขา ไม่ต้องตั้งรหัสผ่าน</div>
  </div>

  <div class="field mt-16">
    <label for="fullname">ชื่อ-นามสกุล <span class="req">*</span></label>
    <input id="fullname" class="input" type="text" name="fullname" autocomplete="name" placeholder="นายสมชาย ใจดี" inputmode="text">
  </div>

  <div class="field">
    <label for="phone">เบอร์โทร <span class="req">*</span></label>
    <input id="phone" class="input" type="tel" name="phone" autocomplete="tel" inputmode="numeric" maxlength="12" placeholder="081-234-5678">
  </div>

  <div class="field">
    <label for="national-id">เลขบัตรประชาชน <span class="req">*</span></label>
    <input id="national-id" class="input" type="text" name="nationalId" inputmode="numeric" maxlength="17" placeholder="1-2345-67890-12-3" autocomplete="off">
  </div>

  <a class="btn btn-primary btn-block mt-16" href="home.html">
    <i data-lucide="log-in"></i> เข้าสู่ระบบ
  </a>

</div>
</div>
</body>
</html>
